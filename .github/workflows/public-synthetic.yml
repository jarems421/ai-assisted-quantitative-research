name: Public synthetic checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-synthetic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: the GRAPH_CLASSIFICATION_V1_2 test verifies that its rule was committed before its holdout.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install public test dependencies
        run: python -m pip install numpy==2.2.6 jsonschema==4.26.0 tzdata==2026.5 pyarrow==20.0.0 duckdb==1.3.2
      - name: Run public synthetic suite with network and private data blocked
        run: python -m src.research.public_checks
      - name: Run Scout regressions with hosted processes and private reads blocked
        run: python -m src.research.opportunity_scout.v004_checks
      - name: Verify Scout locks between local Python processes using fictional journals
        run: python -m unittest tests.test_scout_v004_process_assurance tests.test_scout_v004_r3_process_assurance -v
      - name: Verify N1 byte capture with fixed harmless local Python subprocess fixtures
        run: python -m unittest tests.test_scout_n1_collector_process_assurance tests.test_scout_n1_preflight_process_assurance -v
