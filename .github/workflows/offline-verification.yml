name: Offline verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned offline dependencies
        run: python -m pip install -r requirements-offline-ci.txt
      - name: Verify native Windows N1 queue fixtures without WMI or accounts
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_scout_n1_preflight_process_assurance -v
      - name: Print complete reviewed inventory and exclusions
        run: python -m src.research.offline_checks --inventory
      - name: Verify fail-closed runner guards
        run: python -m unittest tests.test_offline_checks.GuardTests -v
      - name: Verify native Windows guard path boundaries
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_offline_checks.WindowsGuardTests -v
      - name: Verify native Linux guard descriptor boundaries
        if: runner.os == 'Linux'
        run: python -m unittest tests.test_offline_checks.LinuxGuardTests -v
      - name: Run additional reviewed tests with restricted IO
        run: python -m src.research.offline_checks
      - name: Run existing guarded public suite on both platforms
        run: python -m src.research.public_checks
      - name: Run existing guarded Scout suite on Windows
        if: runner.os == 'Windows'
        run: python -m src.research.opportunity_scout.v004_checks
      - name: Run guarded Scout with the actual Linux interpreter path
        if: runner.os == 'Linux'
        # setup-python's `python` is a symlink on Linux. N1 fixtures correctly
        # refuse symlinked binary bindings; execute the real interpreter itself.
        run: python -c "import os, pathlib, sys; p = str(pathlib.Path(sys.executable).resolve()); os.execv(p, [p, '-m', 'src.research.opportunity_scout.v004_checks'])"
      - name: Verify real local Python lock contention on both platforms
        run: python -m unittest tests.test_scout_v004_process_assurance tests.test_scout_v004_r3_process_assurance -v
      - name: Verify exploratory runner bounded capture stops local Python process trees
        run: python -m unittest tests.test_scout_exploratory_capture_process_assurance -v
      - name: Preserve native Windows collector process assurance
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_scout_n1_collector_process_assurance -v
      - name: Verify checkout remains unchanged
        run: git diff --exit-code HEAD
